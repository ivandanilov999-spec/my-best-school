<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Магазин Кастомизации LMS</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; text-align: center; }
        header { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 2rem; }
        .container { max-width: 900px; margin: 2rem auto; padding: 1.5rem; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .skin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 1.5rem; }
        .skin-card { border: 2px solid #e2e8f0; padding: 20px; border-radius: 16px; background: white; transition: 0.3s; }
        .skin-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .preview-box { height: 100px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: #6366f1; color: white; }
        button:hover { background: #4f46e5; }
        .back-link { display: inline-block; margin-top: 20px; color: #6366f1; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1 style="margin:0;">🛍️ АКАДЕМИЧЕСКИЙ МАГАЗИН СКИНОВ</h1>
        <p>Кастомизируй свое учебное пространство за учебные монеты</p>
    </header>

    <div class="container">
        <h2>Доступные визуальные темы</h2>
        <div class="skin-grid">
            <!-- ТЕМНАЯ ТЕМА -->
            <div class="skin-card">
                <div class="preview-box" style="background: #1e293b;"></div>
                <h3>🌌 Ночной Космос (Темная)</h3>
                <p>Цена: 🪙 30 монет</p>
                <button onclick="applyTheme('dark', 30)">Купить и применить</button>
            </div>
            <!-- КИБЕРПАНК -->
            <div class="skin-card">
                <div class="preview-box" style="background: linear-gradient(135deg, #ff007f, #7f00ff);"></div>
                <h3>⚡ Неоновый Киберпанк</h3>
                <p>Цена: 🪙 60 монет</p>
                <button onclick="applyTheme('cyberpunk', 60)" style="background:#ff007f;">Купить и применить</button>
            </div>
            <!-- МИНТ -->
            <div class="skin-card">
                <div class="preview-box" style="background: #f0fdf4; border-color: #10b981;"></div>
                <h3>🍃 Освежающая Мята</h3>
                <p>Цена: 🪙 15 монет</p>
                <button onclick="applyTheme('mint', 15)" style="background:#10b981;">Купить и применить</button>
            </div>
        </div>
        <a href="/" class="back-link">← Вернуться на главную страницу школы</a>
    </div>

    <script>
        function applyTheme(themeName, price) {
            // В реальной системе здесь идет fetch запрос списания монет
            localStorage.setItem('school-theme', themeName);
            alert(`Тема "${themeName}" успешно куплена и активирована!`);
        }
    </script>
</body>
</html>
