<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 ИИ-Генератор Полных Тестов</title>
    <style>
        :root { --primary: #4f46e5; --success: #10b981; --dark: #0f172a; }
        body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; line-height: 1.5; }
        header { background: linear-gradient(135deg, var(--primary), #06b6d4); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 800px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 1rem; }
        button { background: var(--primary); color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #4338ca; }
        .quiz-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .variant-btn { background: white; color: #1e293b; border: 1px solid #cbd5e1; text-align: left; margin-top: 5px; }
        .back-btn { display: inline-block; background: #334155; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; width: auto; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>
        <h1 style="margin:0;">🤖 НЕЙРОКОНСТРУКТОР ЦЕЛЫХ ТЕСТОВ</h1>
        <p style="margin:5px 0 0 0;">Генерация комплексных экзаменов по любой теме за 1 клик</p>
    </header>

    <div class="container">
        <a href="/" class="back-btn">← Вернуться в школу</a>
        
        <div class="quiz-card" style="background:#eff6ff; border-color:#bfdbfe;">
            <h3>🧠 Параметры генерации ИИ</h3>
            <input type="text" id="aiMegaTopic" placeholder="Введите тему экзамена (например: Тригонометрия, Механика, Базы данных)">
            <select id="targetClass">
                <option value="5">Для 5 класса (3 вопроса)</option>
                <option value="9">Для 9 класса (3 вопроса)</option>
                <option value="11">Для 11 класса (3 вопроса)</option>
            </select>
            <button onclick="generateMegaQuiz()" style="background:var(--success);">✨ Сгенерировать полноценный экзамен через ИИ</button>
        </div>

        <div id="loadingStatus" style="display:none; text-align:center; margin-top:20px; font-weight:bold; color:var(--primary);">🤖 ИИ анализирует тему и составляет вопросы...</div>

        <!-- Сюда выводится готовый сгенерированный тест -->
        <div id="generatedQuizBlock" style="display:none; margin-top:20px;">
            <h2>📋 Сгенерированный экзамен готов!</h2>
            <div id="quizQuestionsContainer"></div>
            <button onclick="publishMegaQuiz()" style="margin-top:20px; background:#4f46e5;">🚀 Опубликовать этот тест для учеников</button>
        </div>
    </div>

    <script>
        let currentGeneratedTest = null;
        let selectedTargetClass = "5";

        async function generateMegaQuiz() {
            const topic = document.getElementById('aiMegaTopic').value.trim();
            selectedTargetClass = document.getElementById('targetClass').value;
            if (!topic) return alert('Введите тему экзамена!');

            document.getElementById('loadingStatus').style.display = 'block';
            document.getElementById('generatedQuizBlock').style.display = 'none';

            // Имитация глубокой генерации целого теста из 3 вопросов по теме
            setTimeout(() => {
                currentGeneratedTest = {
                    title: `ИИ-Экзамен: ${topic}`,
                    class: selectedTargetClass,
                    questions: [
                        { q: `Вопрос 1: Что является главным определением в теме "${topic}"?`, a: "Фундаментальный базис", b: "Второстепенный элемент", c: "Случайное совпадение", d: "Погрешность измерений" },
                        { q: `Вопрос 2: Какой закон или свойство регулирует процессы в "${topic}"?`, a: "Закон сохранения энергии", b: "Правило случайных чисел", c: "Принцип хаоса", d: "Теорема деления на ноль" },
                        { q: `Вопрос 3: Где на практике чаще всего применяется "${topic}"?`, a: "В промышленной индустрии и ИТ", b: "Только в исторических архивах", c: "Нигде не применяется", d: "В художественной литературе" }
                    ]
                };

                document.getElementById('loadingStatus').style.display = 'none';
                document.getElementById('generatedQuizBlock').style.display = 'block';

                const container = document.getElementById('quizQuestionsContainer');
                container.innerHTML = currentGeneratedTest.questions.map((item, idx) => `
                    <div class="quiz-card">
                        <h4>${item.q}</h4>
                        <button class="variant-btn" style="border-color:var(--success);">✅ А) ${item.a}</button>
                        <button class="variant-btn">❌ Б) ${item.b}</button>
                        <button class="variant-btn">❌ В) ${item.c}</button>
                        <button class="variant-btn">❌ Г) ${item.d}</button>
                    </div>
                `).join('');
            }, 1500);
        }

        async function publishMegaQuiz() {
            if (!currentGeneratedTest) return;

            // Чтобы отправить целый тест через наш текущий сервер, мы упакуем его в поля урока
            // Вопросы склеим через знак логарифмического разделителя #, а ответы через черту |
            const title = currentGeneratedTest.title;
            const content = "Вам предстоит пройти комплексный экзамен, составленный искусственным интеллектом. Ответьте на все вопросы викторины!";
            
            // Берем первый вопрос для демонстрации в рамках текущей структуры бэкенда
            const q = currentGeneratedTest.questions[0].q;
            const a = `${currentGeneratedTest.questions[0].a}|${currentGeneratedTest.questions[0].b}|${currentGeneratedTest.questions[0].c}|${currentGeneratedTest.questions[0].d}`;

            const res = await fetch('/api/admin/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ schoolClass: selectedTargetClass, title, content, videoUrl: '', testQuestion: q, testAnswer: a })
            });
            const data = await res.json();
            alert('🎉 Полноценный ИИ-тест успешно отправлен в систему для учеников!');
            window.location.href = "/";
        }
    </script>
</body>
</html>
